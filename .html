<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Infinite "Yes" Button</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --btn-success: #238636;
            --btn-success-hover: #2ea043;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .counter {
            font-size: 32px;
            font-weight: bold;
            color: #58a6ff;
            margin-bottom: 24px;
            font-variant-numeric: tabular-nums;
        }

        .yes-button {
            background-color: var(--btn-success);
            color: #ffffff;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s ease, transform 0.05s ease;
        }

        .yes-button:hover {
            background-color: var(--btn-success-hover);
        }

        .yes-button:active {
            transform: scale(0.95);
        }

        /* Floating "Yes" element styles */
        .floating-yes {
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            font-size: 18px;
            color: #3fb950;
            animation: floatUp 1s ease-out forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Infinite "Yes" Button</h1>
        <p>Should you merge this pull request?</p>
        <div class="counter" id="counter">0</div>
        <button class="yes-button" id="yesBtn">Yes</button>
    </div>

    <script>
        const button = document.getElementById('yesBtn');
        const counterDisplay = document.getElementById('counter');
        let count = 0;

        // Load baseline count from localStorage if it exists
        if (localStorage.getItem('infiniteYesCount')) {
            count = parseInt(localStorage.getItem('infiniteYesCount'), 10);
            counterDisplay.textContent = count.toLocaleString();
        }

        button.addEventListener('click', (e) => {
            count++;
            counterDisplay.textContent = count.toLocaleString();
            localStorage.setItem('infiniteYesCount', count);

            createFloatingYes(e.clientX, e.clientY);
        });

        function createFloatingYes(x, y) {
            const el = document.createElement('div');
            el.className = 'floating-yes';
            el.textContent = 'YES!';
            
            // Center the text over the click target
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 20}px`;

            // Randomize rotation slightly for flair
            const randomRotation = (Math.random() - 0.5) * 30;
            el.style.transform = `rotate(${randomRotation}deg)`;

            document.body.appendChild(el);

            // Clean up DOM after animation ends
            el.addEventListener('animationend', () => {
                el.remove();
            });
        }
    </script>

</body>
</html>
